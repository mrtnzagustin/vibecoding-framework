name: Speckit Enforcement

on:
  pull_request:
    branches: [main, develop, 'feature/**']
  push:
    branches: [main, develop]

jobs:
  speckit-validation:
    name: Validate Spec Documentation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect code changes
        id: changes
        run: |
          # Check if there are code changes (not just docs)
          CODE_CHANGES=$(git diff --name-only ${{ github.event.before }}..${{ github.sha }} | grep -E '\.(ts|js|tsx|jsx|py|go|rs|java|php|rb|swift|kt)$' || echo "")

          if [ -z "$CODE_CHANGES" ]; then
            echo "has_code_changes=false" >> $GITHUB_OUTPUT
            echo "No code changes detected, skipping spec validation"
          else
            echo "has_code_changes=true" >> $GITHUB_OUTPUT
            echo "Code changes detected:"
            echo "$CODE_CHANGES"
          fi

      - name: Extract feature number from branch
        id: feature
        if: steps.changes.outputs.has_code_changes == 'true'
        run: |
          BRANCH_NAME="${{ github.head_ref || github.ref_name }}"
          echo "Branch: $BRANCH_NAME"

          # Extract NNN from branch name
          FEATURE_NUM=$(echo "$BRANCH_NAME" | grep -oE '^[0-9]{3}')

          if [ -z "$FEATURE_NUM" ]; then
            echo "feature_num=" >> $GITHUB_OUTPUT
            echo "Not a feature branch (no NNN- prefix)"
          else
            echo "feature_num=$FEATURE_NUM" >> $GITHUB_OUTPUT
            echo "Feature number: $FEATURE_NUM"
          fi

      - name: Validate spec files exist
        if: steps.changes.outputs.has_code_changes == 'true' && steps.feature.outputs.feature_num != ''
        run: |
          FEATURE_NUM="${{ steps.feature.outputs.feature_num }}"
          echo "Validating specs for feature $FEATURE_NUM"

          # Find spec directory
          SPEC_DIR=$(find specs -maxdepth 1 -type d -name "${FEATURE_NUM}-*" | head -n 1)

          if [ -z "$SPEC_DIR" ]; then
            echo "❌ ERROR: No spec directory found for feature $FEATURE_NUM"
            echo ""
            echo "Expected directory: specs/${FEATURE_NUM}-feature-name/"
            echo ""
            echo "Create specs using:"
            echo "  npm run create-feature \"feature name\""
            echo ""
            exit 1
          fi

          echo "✅ Spec directory found: $SPEC_DIR"

          # Check required files
          REQUIRED_FILES="spec.md plan.md tasks.md"
          ALL_VALID=true

          for file in $REQUIRED_FILES; do
            FILE_PATH="$SPEC_DIR/$file"

            if [ ! -f "$FILE_PATH" ]; then
              echo "❌ Missing: $FILE_PATH"
              ALL_VALID=false
            elif [ ! -s "$FILE_PATH" ]; then
              echo "❌ Empty: $FILE_PATH"
              ALL_VALID=false
            else
              LINE_COUNT=$(wc -l < "$FILE_PATH")
              echo "✅ $file ($LINE_COUNT lines)"
            fi
          done

          if [ "$ALL_VALID" = false ]; then
            echo ""
            echo "❌ Spec validation failed!"
            echo ""
            echo "All feature branches must have:"
            echo "  - spec.md (feature specification)"
            echo "  - plan.md (implementation plan)"
            echo "  - tasks.md (task breakdown)"
            echo ""
            echo "Use templates from .specify/templates/"
            echo ""
            exit 1
          fi

          echo ""
          echo "✅ All spec files validated successfully"

  backend-tests:
    name: Run Backend Tests
    runs-on: ubuntu-latest
    if: hashFiles('backend/package.json') != ''

    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --passWithNoTests

  frontend-tests:
    name: Run Frontend Tests
    runs-on: ubuntu-latest
    if: hashFiles('frontend/package.json') != ''

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test:run -- --passWithNoTests

  root-tests:
    name: Run Tests (Root Project)
    runs-on: ubuntu-latest
    if: hashFiles('package.json') != '' && hashFiles('backend/package.json') == '' && hashFiles('frontend/package.json') == ''

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --passWithNoTests

  python-tests:
    name: Run Python Tests
    runs-on: ubuntu-latest
    if: hashFiles('pyproject.toml') != '' || hashFiles('requirements.txt') != ''

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f pyproject.toml ]; then pip install -e .; fi
          pip install pytest pytest-cov

      - name: Run tests
        run: pytest

  go-tests:
    name: Run Go Tests
    runs-on: ubuntu-latest
    if: hashFiles('go.mod') != ''

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Run tests
        run: go test ./...

  rust-tests:
    name: Run Rust Tests
    runs-on: ubuntu-latest
    if: hashFiles('Cargo.toml') != ''

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true

      - name: Run tests
        run: cargo test

  build-validation:
    name: Validate Build
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: hashFiles('package.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        if: hashFiles('package.json') != ''
        run: npm ci

      - name: Build project
        if: hashFiles('package.json') != ''
        run: |
          if grep -q '"build"' package.json; then
            npm run build
          else
            echo "No build script found, skipping"
          fi

      - name: Build backend
        if: hashFiles('backend/package.json') != ''
        working-directory: ./backend
        run: |
          npm ci
          npm run build

      - name: Build frontend
        if: hashFiles('frontend/package.json') != ''
        working-directory: ./frontend
        run: |
          npm ci
          npm run build

  enforcement-summary:
    name: Enforcement Summary
    runs-on: ubuntu-latest
    needs: [speckit-validation, backend-tests, frontend-tests, root-tests, python-tests, go-tests, rust-tests, build-validation]
    if: always()

    steps:
      - name: Check job results
        run: |
          echo "==================================="
          echo "Speckit Enforcement Summary"
          echo "==================================="
          echo ""
          echo "Speckit Validation: ${{ needs.speckit-validation.result }}"
          echo "Backend Tests: ${{ needs.backend-tests.result }}"
          echo "Frontend Tests: ${{ needs.frontend-tests.result }}"
          echo "Root Tests: ${{ needs.root-tests.result }}"
          echo "Python Tests: ${{ needs.python-tests.result }}"
          echo "Go Tests: ${{ needs.go-tests.result }}"
          echo "Rust Tests: ${{ needs.rust-tests.result }}"
          echo "Build Validation: ${{ needs.build-validation.result }}"
          echo ""

          # Fail if any job failed
          if [[ "${{ needs.speckit-validation.result }}" == "failure" ]] || \
             [[ "${{ needs.backend-tests.result }}" == "failure" ]] || \
             [[ "${{ needs.frontend-tests.result }}" == "failure" ]] || \
             [[ "${{ needs.root-tests.result }}" == "failure" ]] || \
             [[ "${{ needs.python-tests.result }}" == "failure" ]] || \
             [[ "${{ needs.go-tests.result }}" == "failure" ]] || \
             [[ "${{ needs.rust-tests.result }}" == "failure" ]] || \
             [[ "${{ needs.build-validation.result }}" == "failure" ]]; then
            echo "❌ Enforcement checks failed!"
            exit 1
          fi

          echo "✅ All enforcement checks passed!"
